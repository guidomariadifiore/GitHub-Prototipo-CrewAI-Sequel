[project]
name = "test"
version = "0.1.0"
description = "Test using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.7.2",
]

[project.scripts]
testaggio = "testaggio.main:run"
run_crew = "testaggio.main:run"
train = "testaggio.main:train"
replay = "testaggio.main:replay"
test = "testaggio.main:test"
run_with_trigger = "testaggio.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
