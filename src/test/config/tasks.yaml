task1: #code analysis and prompting
  description: >
    Analyze the Java code provided below.
    
    CODE SNIPPET:
    {code_class}
    
    ISSUES:
    {errors}
    
    The focus must be on energy efficiency. It must suggest corrections without modifying the code directly.
  expected_output: >
    A detailed, text-based prompt serving as instructions for the next agent, containing remediation strategies and static plugin integration.
  agent: query_writer

task2: #refactoring
  description: >
    Performs an "aggressive" refactoring of the following Java code using only the prompt generated by task1 as a guide.
    
    CODE SNIPPET:
    {code_class}
    
    It is essential that it must not alter the structure, method signatures, imports, constructors, or original logical behaviour.
  expected_output: >
    Only the refactored Java code. DO NOT include line numbers in the output code.
  agent: code_refactor

task3: #code substitution
  description: >
    Overwrites the file at "{path_class}" with the complete refactored code from the previous task.
    You MUST use the 'File Update Tool'.
  expected_output: >
    Confirmation that the file has been updated.
  agent: code_refactor
  tool: custom

task4: #Scanning and validation
  description: >
    Run the sonar-scanner and Maven commands from the terminal on the newly modified file "{path_class}" in project "{project_key}".
    IMPORTANT: The Maven project is located at "{project_dir}". You MUST execute the command in this directory.
    Must verify the compilation and capture any errors.  
  expected_output: >
    The scan result (Build Success/Failure) according to Quality Gates, without showing the code
  agent: sonar_agent
  tool: custom

conditional_task5: #rollback
  description: >
    Restores the original code in the file "{path_class}" if refactoring has introduced errors.
    You MUST use the 'File Update Tool'.
    
    ORIGINAL FILE CONTENT:
    {code_class}
    
    This is a safety mechanism (fallback).
  expected_output: >
    Confirmation that the original code has been restored.
  agent: code_replacer

conditional_task6: #error summarization
  description: >
    Analyze the build errors and the code context to understand why the refactoring failed.
    Provide a clear summary of the errors to guide the next refactoring attempt.
  expected_output: >
    A concise summary of the build errors and suggestions for fixing them.
  agent: errors_summarizer
