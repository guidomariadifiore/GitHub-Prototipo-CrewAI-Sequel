task1: #code analysis and prompting
  description: >
    Analyze the Java code snippet provided below (lines are numbered).
    
    CODE SNIPPET:
    {code_class}
    
    ISSUES:
    {errors}
    
    The focus must be on energy efficiency. It must suggest corrections without modifying the code directly.
  expected_output: >
    A detailed, text-based prompt serving as instructions for the next agent, containing remediation strategies and static plugin integration.
  agent: query_writer

task2: #refactoring
  description: >
    Performs an "aggressive" refactoring of the following Java code snippet (lines are numbered) using only the prompt generated by task1 as a guide.
    
    CODE SNIPPET:
    {code_class}
    
    It is essential that it must not alter the structure, method signatures, imports, constructors, or original logical behaviour.
  expected_output: >
    Only the refactored Java code. DO NOT include line numbers in the output code.
  agent: code_refactor

task3: #code substitution
  description: >
    Patches the original local file at "{path_class}" with the refactored code from the previous task.
    Look at the original numbered CODE SNIPPET provided in the inputs to identify the exact 'start_line' and 'end_line' (inclusive) that correspond to the code you refactored.
    You MUST use the 'File Patch Tool' with the correct start_line and end_line to ensure you replace exactly the old method/block and nothing else.
  expected_output: >
    Confirmation that the patch has been applied to the specified file.
  agent: code_refactor
  tool: custom

task4: #Scanning and validation
  description: >
    Run the sonar-scanner and Maven commands from the terminal on the newly modified file "{path_class}" in project "{project_key}". Must verify the compilation and capture any errors.  
  expected_output: >
    The scan result (Build Success/Failure) according to Quality Gates, without showing the code
  agent: sonar_agent
  tool: custom

conditional_task5: #rollback
  description: >
    Restores the original code snippet in the file "{path_class}" if refactoring has introduced errors.
    You MUST use the 'File Patch Tool'.
    Identify the correct 'start_line' and 'end_line' from the snippet below.
    
    ORIGINAL SNIPPET:
    {code_class}
    
    This is a safety mechanism (fallback).
  expected_output: >
    Confirmation that the original code has been reinserted into the target file, cancelling the refactoring.
  agent: code_replacer

