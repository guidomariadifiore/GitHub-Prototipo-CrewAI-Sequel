# TESTARE (avvia da 0 e vedi che succede)

task1: #code analysis and prompting
  description: >
    Analyze the Java code provided below.

    CODE SNIPPET:
    {code_class}

    ISSUES:
    {errors}

    The focus must be on energy efficiency. It must suggest corrections without modifying the code directly.
  expected_output: >
    A detailed, text-based prompt serving as instructions for the next agent, containing remediation strategies and static plugin integration.
  agent: query_writer

task2: #refactoring
  description: >
    Performs an "aggressive" refactoring of the following Java code using only the prompt generated by task1 as a guide.

    CODE SNIPPET:
    {code_class}

    It is essential that it must not alter the structure, method signatures, imports, constructors, or original logical behaviour.

    CRITICAL REQUIREMENT:
    You MUST return the FULL, COMPLETE content of the file. 
    - Do NOT use placeholders like "// ... existing code ...". 
    - Do NOT omit imports, package declarations, or unmodified methods.
    - The output must be ready to be copy-pasted directly into the file to replace it entirely.

  expected_output: >
    The COMPLETE, FULLY EXPANDED refactored Java code. No comments like "rest of code".  agent: code_refactor
  agent: code_refactor

conditional_task6: #error summarization
  description: >
    Analyze the build errors and the code context to understand why the refactoring failed.
    Provide a clear summary of the errors to guide the next refactoring attempt.
  expected_output: >
    A concise summary of the build errors and suggestions for fixing them.
  agent: errors_summarizer
