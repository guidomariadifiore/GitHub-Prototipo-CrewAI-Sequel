task1: #code analysis and prompting
  description: >
    It must analyse the Java code received as input to generate an advanced prompt. The focus must be on energy efficiency. It must suggest corrections without modifying the code directly.
  expected_output: >
    A detailed, text-based prompt serving as instructions for the next agent, containing remediation strategies and static plugin integration.
  agent: query_writer

task2: #refactoring
  description: >
    Performs an "aggressive" refactoring of Java code using only the prompt generated by task1 as a guide. It is essential that it must not alter the structure, method signatures, imports, constructors, or original logical behaviour.
  expected_output: >
    Only refactored code that improves energy efficiency. No additional text, no added test cases.
  agent: code_refactor

task3: #code substitution
  description: >
    Overwrites the original local file with the newly generated refactored code, maintaining UTF-8 encoding.
  expected_output: >
    Confirmation that the replacement has been made in the specified file. It must not return the contents of the file, but only the outcome of the action.
  agent: code_refactor
  tool: custom

task4: #Scanning and validation
  description: >
    Run the sonar-scanner and Maven commands from the terminal on the newly modified file. Must verify the compilation and capture any errors.  
  expected_output: >
    The scan result (Build Success/Failure) according to Quality Gates, without showing the code
  agent: sonar_agent
  tool: custom

conditional_task5: #rollback
  description: >
    Restores the original code in the file if refactoring has introduced errors. This is a safety mechanism (fallback).
  expected_output: >
    Confirmation that the original code has been reinserted into the target file, cancelling the refactoring.
  agent: code_replacer

